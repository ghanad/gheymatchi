services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DB_PATH: /data/gheymatchi.db
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/usr/local/bin/gheymatchi-migrate"]
    environment:
      APP_ENV: local
      DB_PATH: /data/gheymatchi.db
    profiles:
      - tools
    volumes:
      - ./data:/data
