services:
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/usr/local/bin/gheymatchi-migrate"]
    environment:
      APP_ENV: local
      DB_PATH: /data/gheymatchi.db
    volumes:
      - ./data:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DB_PATH: /data/gheymatchi.db
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_API_BASE_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/usr/local/bin/gheymatchi-worker"]
    environment:
      APP_ENV: local
      DB_PATH: /data/gheymatchi.db
      WORKER_INTERVAL: 5m
      PRICE_FETCHER: mock
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-dry_run}
      NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL_TO:-}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-3}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    volumes:
      - ./data:/data
  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/usr/local/bin/gheymatchi-seed"]
    environment:
      APP_ENV: local
      DB_PATH: /data/gheymatchi.db
    profiles:
      - tools
    volumes:
      - ./data:/data
