services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DB_PATH: /data/gheymatchi.db
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_API_BASE_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/usr/local/bin/gheymatchi-worker"]
    environment:
      APP_ENV: local
      DB_PATH: /data/gheymatchi.db
      WORKER_INTERVAL: 5m
      PRICE_FETCHER: mock
    depends_on:
      - api
    volumes:
      - ./data:/data
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/usr/local/bin/gheymatchi-migrate"]
    environment:
      APP_ENV: local
      DB_PATH: /data/gheymatchi.db
    profiles:
      - tools
    volumes:
      - ./data:/data
